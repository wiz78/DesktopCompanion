; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem2101
upload_protocol = esptool
upload_port = /dev/cu.usbmodem2101
build_src_flags = 
	-std=c++2a
	-std=gnu++2a
build_unflags = -std=gnu++11
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM

board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_qspi
board_upload.flash_size = 4MB

debug_tool = esp-builtin
debug_init_break = tbreak setup
extra_scripts = pre:extra_script.py
lib_compat_mode = strict
lib_deps = 
	WiFi
	WebServer
	FS
	DNSServer
	ESPmDNS
	Update
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit GFX Library@^1.12.5
    adafruit/Adafruit_VL53L0X@^1.2.4      ; ToF Laser Distance Sensor
    adafruit/Adafruit MPU6050@^2.2.6      ; Accelerometer & Temp
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4          ; Weather API JSON parser

