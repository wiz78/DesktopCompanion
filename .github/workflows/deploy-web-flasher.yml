name: Deploy Web Flasher to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          pip install --upgrade platformio esptool

      - name: Cache PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Build Firmware
        run: |
          pio run -e esp32-s3-mini

      - name: Merge Factory Binary
        run: |
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" | head -n 1)
          if [ -z "$BOOT_APP0" ]; then
            echo "Error: boot_app0.bin not found!"
            exit 1
          fi
          echo "Using boot_app0 from: $BOOT_APP0"

          esptool.py --chip esp32s3 merge_bin \
            -o web-flasher/friendlybot-factory.bin \
            --flash_mode dio --flash_size 4MB \
            0x0000 .pio/build/esp32-s3-mini/bootloader.bin \
            0x8000 .pio/build/esp32-s3-mini/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 .pio/build/esp32-s3-mini/firmware.bin

          ls -lh web-flasher/friendlybot-factory.bin

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
